name: LTA Data - Monthly Auto Fetch

on:
  # LTA publishes each month's data by the 10th of the following month.
  # Run daily from the 11th through the 20th at 01:00 UTC; the pipeline
  # itself skips work (exit 0, no API calls) once that month's data is
  # already covered by an existing dated file, and exits non-zero (a
  # visible "failed" run) if the data isn't published yet — so the next
  # day's scheduled run retries.
  schedule:
    - cron: '0 1 11-20 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for and fetch new month if published
        id: pipeline
        run: python3 monthly_pipeline.py "${{ secrets.LTA_API_KEY }}"
        env:
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
        continue-on-error: true

      - name: Upload reports as workflow artifacts
        if: steps.pipeline.outputs.updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lta-train-od-reports
          path: |
            ${{ steps.pipeline.outputs.full_path }}
            ${{ steps.pipeline.outputs.ew1_path }}
          retention-days: 30

      - name: Commit reports
        if: steps.pipeline.outputs.updated == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "${{ steps.pipeline.outputs.full_path }}" "${{ steps.pipeline.outputs.ew1_path }}"
          git commit -m "chore: monthly auto-fetch of LTA train OD data (${{ steps.pipeline.outputs.start }} to ${{ steps.pipeline.outputs.end }})"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check email configuration
        id: emailcheck
        if: steps.pipeline.outputs.updated == 'true'
        run: |
          if [ -n "${{ secrets.SMTP_SERVER }}" ] && [ -n "${{ secrets.SMTP_USERNAME }}" ] && [ -n "${{ secrets.SMTP_PASSWORD }}" ] && [ -n "${{ secrets.NOTIFY_EMAIL_TO }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Email secrets not fully configured — skipping email step. See LTA_DATA_SETUP.md."
          fi

      - name: Build email body
        id: emailbody
        if: steps.pipeline.outputs.updated == 'true' && steps.emailcheck.outputs.configured == 'true'
        run: |
          full_url="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.pipeline.outputs.full_path }}"
          ew1_url="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/${{ steps.pipeline.outputs.ew1_path }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "html<<EOF"
            cat <<HTML
          <h2>LTA Train OD Data &mdash; Monthly Auto Fetch</h2>
          <p>New month published: <strong>${{ steps.pipeline.outputs.end }}</strong></p>
          <p>Data range in this file: <strong>${{ steps.pipeline.outputs.start }} to ${{ steps.pipeline.outputs.end }}</strong></p>
          <p><strong>Download links:</strong></p>
          <ul>
            <li><a href="$full_url">Full dataset (all stations)</a></li>
            <li><a href="$ew1_url">EW1-filtered dataset</a></li>
          </ul>
          <p style="color:#666;font-size:0.9em;">Triggered by monthly schedule &middot; <a href="$run_url">View workflow run</a></p>
          HTML
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Email the report
        if: steps.pipeline.outputs.updated == 'true' && steps.emailcheck.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "LTA Train OD Data (Auto): new month ${{ steps.pipeline.outputs.end }} published"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: LTA Data Fetcher <${{ secrets.SMTP_USERNAME }}>
          content_type: text/html
          body: ${{ steps.emailbody.outputs.html }}

      - name: Fail the run if data wasn't published yet
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "New month's data not yet available — will retry on next scheduled run."
          exit 1
