name: LTA Data - Monthly Auto Fetch

on:
  # LTA publishes each month's data by the 10th of the following month.
  # Run daily from the 11th through the 20th at 01:00 UTC; the pipeline
  # itself skips work (exit 0, no API calls) once that month's data is
  # already committed, and exits non-zero (a visible "failed" run) if the
  # data isn't published yet — so the next day's scheduled run retries.
  schedule:
    - cron: '0 1 11-20 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for and fetch new month if published
        id: pipeline
        run: python3 monthly_pipeline.py "${{ secrets.LTA_API_KEY }}"
        env:
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
        continue-on-error: true

      - name: Upload reports as workflow artifacts
        if: steps.pipeline.outputs.updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lta-train-od-reports
          path: |
            lta_train_od_historical_by_month.xlsx
            lta_train_od_EW1_by_month.xlsx
          retention-days: 30

      - name: Commit reports
        if: steps.pipeline.outputs.updated == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add lta_train_od_historical_by_month.xlsx lta_train_od_EW1_by_month.xlsx
          git commit -m "chore: monthly auto-fetch of LTA train OD data"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail the run if data wasn't published yet
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "New month's data not yet available — will retry on next scheduled run."
          exit 1
