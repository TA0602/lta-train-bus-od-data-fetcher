name: LTA Train Data - Resend Email

on:
  # Manual trigger only — emails download links for whatever the most
  # recently built report pair in data/ is, without calling the LTA API.
  # Useful for testing the email step itself, or re-sending a
  # notification without re-fetching data.
  workflow_dispatch:

jobs:
  resend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find latest existing report files
        id: pipeline
        run: python3 resend_train_pipeline.py

      - name: Check email configuration
        id: emailcheck
        run: |
          if [ -n "${{ secrets.SMTP_SERVER }}" ] && [ -n "${{ secrets.SMTP_USERNAME }}" ] && [ -n "${{ secrets.SMTP_PASSWORD }}" ] && [ -n "${{ secrets.NOTIFY_EMAIL_TO }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Email secrets not fully configured — cannot send."
          fi

      - name: Build email body
        id: emailbody
        if: steps.emailcheck.outputs.configured == 'true'
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "html<<HTMLEOF"
            echo "<h2>LTA Train OD Data &mdash; Resend</h2>"
            echo "<p>Months: <strong>${{ steps.pipeline.outputs.start }} to ${{ steps.pipeline.outputs.end }}</strong> (${{ steps.pipeline.outputs.count }} month(s))</p>"
            echo "<p><strong>Download links (one file per month):</strong></p>"
            echo "<ul>"
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              url="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/$p"
              echo "  <li><a href=\"$url\">$(basename "$p")</a></li>"
            done < report_files.txt
            echo "</ul>"
            echo "<p style=\"color:#666;font-size:0.9em;\">Resent from already-fetched data (no new API call) &middot; <a href=\"$run_url\">View workflow run</a></p>"
            echo "HTMLEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Email the report
        if: steps.emailcheck.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v21
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "LTA Train OD Data (Resend): ${{ steps.pipeline.outputs.start }} to ${{ steps.pipeline.outputs.end }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: LTA Data Fetcher <${{ secrets.SMTP_USERNAME }}>
          html_body: ${{ steps.emailbody.outputs.html }}
