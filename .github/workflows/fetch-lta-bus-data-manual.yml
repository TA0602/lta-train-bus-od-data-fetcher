name: LTA Bus OD Data - Manual Fetch

on:
  # Manual trigger from the Actions tab. Always fetches the last 3
  # published months (checking a 4th as a boundary confirmation) and
  # writes a new, uniquely-named file — never overwrites a previous run's
  # output.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and build dated report
        id: pipeline
        run: python3 manual_bus_pipeline.py "${{ secrets.LTA_API_KEY }}" 4
        env:
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: lta-bus-od-reports
          path: data/*_${{ steps.pipeline.outputs.ts }}.xlsx
          retention-days: 30

      - name: Commit report
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          xargs -a report_files.txt git add --
          git commit -m "chore: manual fetch of LTA bus OD data (${{ steps.pipeline.outputs.start }} to ${{ steps.pipeline.outputs.end }}, ${{ steps.pipeline.outputs.count }} month(s))"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check email configuration
        id: emailcheck
        run: |
          if [ -n "${{ secrets.SMTP_SERVER }}" ] && [ -n "${{ secrets.SMTP_USERNAME }}" ] && [ -n "${{ secrets.SMTP_PASSWORD }}" ] && [ -n "${{ secrets.NOTIFY_EMAIL_TO }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Email secrets not fully configured — skipping email step. See LTA_DATA_SETUP.md."
          fi

      - name: Build email body
        id: emailbody
        if: steps.emailcheck.outputs.configured == 'true'
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "html<<HTMLEOF"
            echo "<h2>LTA Bus OD Data &mdash; Manual Fetch</h2>"
            echo "<p>Months fetched: <strong>${{ steps.pipeline.outputs.start }} to ${{ steps.pipeline.outputs.end }}</strong> (${{ steps.pipeline.outputs.count }} month(s))</p>"
            echo "<p>Filtered to bus stop <strong>77009</strong>.</p>"
            echo "<p><strong>Download links (one file per month):</strong></p>"
            echo "<ul>"
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              url="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/$p"
              echo "  <li><a href=\"$url\">$(basename "$p")</a></li>"
            done < report_files.txt
            echo "</ul>"
            echo "<p style=\"color:#666;font-size:0.9em;\">Triggered manually &middot; <a href=\"$run_url\">View workflow run</a></p>"
            echo "HTMLEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Email the report
        if: steps.emailcheck.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v21
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "LTA Bus OD Data (Manual): ${{ steps.pipeline.outputs.start }} to ${{ steps.pipeline.outputs.end }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: LTA Data Fetcher <${{ secrets.SMTP_USERNAME }}>
          html_body: ${{ steps.emailbody.outputs.html }}
