name: Fetch LTA Train Historical Data

on:
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch LTA historical data
        run: python3 fetch_lta_data.py "${{ secrets.LTA_API_KEY }}" "lta_train_od_historical.csv" 24
        env:
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}

      - name: Compress output
        run: gzip -k lta_train_od_historical.csv

      # The dataset can be well over 100MB (GitHub's per-file push limit),
      # so the primary way to get it is as a downloadable workflow artifact
      # rather than a git commit.
      - name: Upload data as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lta-train-od-historical-data
          path: |
            lta_train_od_historical.csv
            lta_train_od_historical.csv.gz
          retention-days: 30

      - name: Commit compressed data if small enough
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          size=$(stat -c%s lta_train_od_historical.csv.gz)
          if [ "$size" -lt 50000000 ]; then
            git add lta_train_od_historical.csv.gz
            git commit -m "chore: fetch LTA train OD historical data" || true
            git push origin main
          else
            echo "Compressed file is ${size} bytes, too large to commit — download it from the workflow artifact instead."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
